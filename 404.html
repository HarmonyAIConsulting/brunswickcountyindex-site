        <h2 style="font-family:Cinzel,serif;font-size:1.5rem;">About Brunswick County</h2>
        <p>Brunswick County is the southernmost county in North Carolina, bordered by the Atlantic Ocean to the south, the Cape Fear River to the east, and South Carolina to the south and west. It encompasses 20 municipalities across approximately 1,050 square miles, including the barrier island communities of Ocean Isle Beach, Sunset Beach, Holden Beach, Oak Island, Caswell Beach, and Bald Head Island, along with mainland towns like Shallotte, Southport, Leland, Bolivia, and Calabash — famously known as the Seafood Capital of the World. With over 45 miles of coastline, 30+ golf courses, historic lighthouses, and a rapidly growing population, Brunswick County is one of the fastest-growing counties in North Carolina.</p>
